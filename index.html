<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parekoy AI Coach</title>
<style>
body{font-family:system-ui; background:#0a0a0a; color:#eee; margin:0; padding:0}
.header{padding:16px; text-align:center; background:#111}
.card{background:#1c1c1c; padding:16px; margin:12px; border-radius:14px; border:1px solid #2a2a2a}
.btn{width:100%; padding:16px; border-radius:12px; border:none; font-weight:900; font-size:17px; cursor:pointer}
.mainbtn{background:#00e676; color:#000; font-size:18px}
.small{color:#888; font-size:12px}
#webview{display:none; width:100%; height:85vh; border:none}
</style>
</head>
<body>

<div id="home">
<div class="header">
<h2 style="color:#00e676; margin:0">PAREKOY AI COACH</h2>
<p class="small">5min | 10min | 15min | 1Day - Pang-preno</p>
</div>

<div class="card">
<h3>✅ Checklist Bago Mag Trade</h3>
<label><input type="checkbox" id="c1"> 1Day trend alam mo?</label><br><br>
<label><input type="checkbox" id="c2"> 15min nasa support?</label><br><br>
<label><input type="checkbox" id="c3"> 5min kalmado na?</label>
<p id="out" style="font-weight:bold; margin-top:10px"></p>
<button class="btn" style="background:#333; color:white" onclick="check()">I-CHECK MUNA</button>
</div>

<div class="card">
<button class="btn mainbtn" onclick="openTrade()">🚀 LETS TRADE PAREKOY</button>
<p class="small" style="text-align:center; margin-top:8px">Pag click, bubukas Expert Option site sa loob ng page natin</p>
</div>
</div>

<!-- WEBVIEW NG EXPERT OPTION -->
<div id="tradeView" style="display:none">
<div style="padding:10px; background:#111; display:flex; justify-content:space-between; align-items:center">
<button onclick="closeTrade()" style="padding:8px 14px; border-radius:8px; border:none; background:#333; color:white">⬅ Balik sa Coach</button>
<span style="font-size:12px; color:#888">Expert Option WebView</span>
</div>
<iframe id="webview" src=""></iframe>
</div>

<script>
function check(){
 let a=c1.checked, b=c2.checked, c=c3.checked;
 let o=document.getElementById('out');
 o.innerHTML=(a&&b&&c) ? "✅ Pwede na Parekoy, pero maliit lang!" : "⛔ Wait muna, kulang pa checklist.";
 o.style.color=(a&&b&&c) ? "#00e676" : "#ff8f00";
}
function openTrade(){
 document.getElementById('home').style.display='none';
 document.getElementById('tradeView').style.display='block';
 let frame=document.getElementById('webview');
 frame.style.display='block';
 frame.src='https://expertoption.com';
 // Pag blocked ng Expert Option ang iframe, bubukas sa new tab
 setTimeout(()=>{
   try{
     if(!frame.contentWindow || frame.contentWindow.length==0){
       // fallback
     }
   }catch(e){
     window.open('https://expertoption.com','_blank');
   }
 },1500);
}
function closeTrade(){
 document.getElementById('tradeView').style.display='none';
 document.getElementById('home').style.display='block';
 document.getElementById('webview').src='';
}
</script>
</body>
</html>
